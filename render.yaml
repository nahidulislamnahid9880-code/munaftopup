services:
  - type: web
    name: strikevault-topup
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSCODE
        sync: false
