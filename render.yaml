services:
  - type: web
    name: strikevault-topup
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSCODE
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFICATION_EMAIL
        value: abdulmunafadmin@gmail.com
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: SMS_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: BKASH_NUMBER
        sync: false
      - key: NAGAD_NUMBER
        sync: false
      - key: WEBSITE_URL
        value: https://munaftopup.onrender.com
      - key: GEMINI_API_KEY
        sync: false
